name: Generate Keystore (uso único)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias pensum-key \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "TuPasswordSegura123" \
            -keypass "TuPasswordSegura123" \
            -dname "CN=Pensum, OU=Dev, O=Personal, L=Ciudad, S=Estado, C=DO"

      - name: Encode to base64
        run: |
          base64 -w 0 release-keystore.jks > keystore.b64
          echo "=== COPIA ESTE VALOR EN GITHUB SECRETS ==="
          cat keystore.b64

      - name: Upload as artifact (opcional)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.b64
